$kind: http-request
url: "{{seenjoy_url}}/v1/categories/{{id}}"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"slug\": \"_marketing_\"\r

    }"
scripts:
  - type: afterResponse
    code: "const schema ={\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"id\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"slug\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"nameEn\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"nameBn\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"createdAt\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"updatedAt\": {\r

      \      \"type\": \"string\"\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"id\",\r

      \    \"slug\",\r

      \    \"nameEn\",\r

      \    \"nameBn\",\r

      \    \"createdAt\",\r

      \    \"updatedAt\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", ()=>{\r

      \    pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true\r

      })\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time\", () =>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      })\r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      \r

      pm.test(\"Content-Type is application/json; charset=utf-8\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      \    })"
    language: text/javascript
order: 5000
