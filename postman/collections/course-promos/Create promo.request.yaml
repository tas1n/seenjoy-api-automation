$kind: http-request
url: "{{seenjoy_url}}/v1/courses/{{courseId}}/promos"
method: POST
body:
  type: json
  content: "{\r

    \  \"code\": \"EARLYBIRD20\",\r

    \  \"type\": \"PERCENTAGE\",\r

    \  \"amount\": 20,\r

    \  \"validFrom\": \"{{validFrom}}\",\r

    \  \"validUntil\": \"{{validUntil}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: beforeRequest
    code: "let randomDay = Math.floor(Math.random()*30) +1;\r

      \r

      let validFrom = new Date();\r

      validFrom.setDate(validFrom.getDate() + randomDay);\r

      let validUntil = new Date();\r

      validUntil.setDate(validUntil.getDate() + randomDay + 10);\r

      \r

      pm.variables.set(\"validFrom\", validFrom.toISOString());\r

      pm.variables.set(\"validUntil\", validUntil.toISOString());"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      const schema = {\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"id\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"courseId\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"code\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"type\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"amount\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"validFrom\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"validUntil\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"createdAt\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"updatedAt\": {\r

      \      \"type\": \"string\"\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"id\",\r

      \    \"courseId\",\r

      \    \"code\",\r

      \    \"type\",\r

      \    \"amount\",\r

      \    \"validFrom\",\r

      \    \"validUntil\",\r

      \    \"createdAt\",\r

      \    \"updatedAt\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", ()=>{\r

      \    pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true\r

      })"
    language: text/javascript
order: 1000
