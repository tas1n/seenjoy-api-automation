      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      \r

      pm.test(\"Content-Type is application/json; charset=utf-8\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      \    })\r

      \r

      pm.test(\"Response body contains sent: true\", function () {\r

      \    pm.expect(pm.response.json().sent).to.be.true;\r

      });\r

      \r

      pm.test(\"Response body contains correct email\", function () {\r

      \    pm.expect(pm.response.json().email).to.equal(\"saiydur.cse@gmail.com\");\r

      });"
