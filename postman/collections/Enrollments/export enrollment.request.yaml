$kind: http-request
url: "{{seenjoy_url}}/v1/enrollments/export"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time\", () =>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      })\r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      \r

      pm.test(\"Content-Type is text/csv; charset=utf-8\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"text/csv; charset=utf-8\");\r

      \    })\r

      \r\n"
    language: text/javascript
order: 3000
