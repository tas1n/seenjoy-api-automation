$kind: http-request
url: "{{seenjoy_url}}/v1/user-stories/{{user_storyId}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      pm.test(\"COntent-Type is application/json\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      })\r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      const schema={\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"id\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"personName\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"imageUrl\": {\r

      \      \"type\": \"null\"\r

      \    },\r

      \    \"videoUrl\": {\r

      \      \"type\": \"null\"\r

      \    },\r

      \    \"storyEn\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"storyBn\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"outcomeEn\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"outcomeBn\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"order\": {\r

      \      \"type\": \"integer\"\r

      \    },\r

      \    \"createdAt\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"updatedAt\": {\r

      \      \"type\": \"string\"\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"id\",\r

      \    \"personName\",\r

      \    \"imageUrl\",\r

      \    \"videoUrl\",\r

      \    \"storyEn\",\r

      \    \"storyBn\",\r

      \    \"outcomeEn\",\r

      \    \"outcomeBn\",\r

      \    \"order\",\r

      \    \"createdAt\",\r

      \    \"updatedAt\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", ()=>{\r

      \    pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true;\r

      })"
    language: text/javascript
order: 3000
