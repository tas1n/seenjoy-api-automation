$kind: http-request
url: "{{seenjoy_url}}/v1/email-templates/{{userId}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time\", () =>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      \    \r

      })\r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      \r

      pm.test(\"Content-Type is application/json; charset=utf-8\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      \    })\r

      \r

      pm.test(\"Slug\", ()=>{\r

      \    pm.expect(pm.response.json()[0].course.slug).to.eql(\"speak-to-win\")\r

      })\r

      \r

      pm.environment.set(\"type\", pm.response.json()[1].type);\r\n"
    language: text/javascript
order: 4000
