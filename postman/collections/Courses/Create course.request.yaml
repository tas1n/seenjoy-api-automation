$kind: http-request
url: "{{seenjoy_url}}/v1/courses"
method: POST
body:
  type: json
  content: "\r

    {\r

    \  \"titleEn\": \"Introduction to Freelancing\",\r

    \  \"titleBn\": \"ফ্রিল্যান্সিং পরিচিতি\",\r

    \  \"slug\": \"introduction-to-freelancing-test-01\",\r

    \  \"basePrice\": 5000,\r

    \  \"startDate\": \"2026-12-01T10:00:00.000Z\"\r

    }\r

    \r\n"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"response time is less than 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      pm.test(\"Content-Type is application/json; charset=utf-8\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      });\r

      \r\n"
    language: text/javascript
order: 6000
