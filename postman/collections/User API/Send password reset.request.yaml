$kind: http-request
url: "{{seenjoy_url}}/v1/users/cmw98e64e001601lp1w3pn5ly/send-password-reset"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 204 No Content\", function () {\r

      \    pm.response.to.have.status(204);\r

      });\r

      \r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.test(\"Response body is empty\", function () {\r

      \    pm.expect(pm.response.text()).to.be.empty;\r

      });\r

      \r

      pm.test(\"Request was authenticated with Bearer token\", function () {\r

      \    pm.expect(pm.request.headers.get(\"Authorization\")).to.include(\"Bearer\");\r

      });\r

      \r

      if (pm.response.code === 401) {\r

      pm.test(\"Request is unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      }"
    language: text/javascript
order: 8000
