$kind: http-request
url: "{{seenjoy_url}}/v1/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "const schema =\r

      {\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"id\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"username\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"accountType\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"email\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"phone\": {\r

      \      \"type\": \"null\"\r

      \    },\r

      \    \"whatsapp\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"isEmailVerified\": {\r

      \      \"type\": \"boolean\"\r

      \    },\r

      \    \"avatarUrl\": {\r

      \      \"type\": \"null\"\r

      \    },\r

      \    \"deletedAt\": {\r

      \      \"type\": \"null\"\r

      \    },\r

      \    \"name\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"role\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"passwordSetAt\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"createdAt\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"profileComplete\": {\r

      \      \"type\": \"boolean\"\r

      \    },\r

      \    \"missing\": {\r

      \      \"type\": \"array\",\r

      \      \"items\": {}\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"id\",\r

      \    \"username\",\r

      \    \"accountType\",\r

      \    \"email\",\r

      \    \"phone\",\r

      \    \"whatsapp\",\r

      \    \"isEmailVerified\",\r

      \    \"avatarUrl\",\r

      \    \"deletedAt\",\r

      \    \"name\",\r

      \    \"role\",\r

      \    \"passwordSetAt\",\r

      \    \"createdAt\",\r

      \    \"profileComplete\",\r

      \    \"missing\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", ()=>{\r

      \    pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true;\r

      })\r

      \r

      pm.test(\"Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time\", ()=>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      })\r

      \r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      pm.test(\"Content-Type is application/json; charset=utf-8\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      });\r

      \r\n"
    language: text/javascript
order: 1000
