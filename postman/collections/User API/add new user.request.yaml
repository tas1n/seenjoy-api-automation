$kind: http-request
url: "{{seenjoy_url}}/v1/users"
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"Jane Doe\",\r

    \  \"username\": \"janedoe\",\r

    \  \"accountType\": \"EMAIL\",\r

    \  \"email\": \"jane@example.com\",\r

    \  \"phone\": \"+8801700000000\",\r

    \  \"whatsapp\": \"+8801700000000\",\r

    \  \"role\": \"STUDENT\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "\r

      \r

      pm.test(\"Response time\", ()=>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      })\r

      \r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      pm.test(\"Content-Type is application/json; charset=utf-8\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      });"
    language: text/javascript
order: 5000
