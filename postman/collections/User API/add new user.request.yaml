$kind: http-request
url: "{{seenjoy_url}}/v1/users"
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"{{name}}\",\r

    \  \"username\": \"{{username}}\",\r

    \  \"accountType\": \"EMAIL\",\r

    \  \"email\": \"{{email}}\",\r

    \  \"phone\": \"{{phone}}\",\r

    \  \"whatsapp\": \"{{phone}}\",\r

    \  \"role\": \"STUDENT\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: "\r

      \r

      pm.test(\"Response time\", ()=>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      })\r

      \r

      pm.test(\"Content-Type is present\", ()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      })\r

      pm.test(\"Content-Type is application/json; charset=utf-8\", () => {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json; charset=utf-8\");\r

      });\r

      \r

      pm.environment.set(\"userId\", pm.response.json().id);"
    language: text/javascript
  - type: beforeRequest
    code: "let random = Math.random().toString(36).substring(2);\r

      \r

      let name = \"umaay\"+random;\r

      let username= \"Humu\"+random;\r

      let email = \"umaay\" + random + \"@example.com\";\r

      let phone = \"+8801\" + Math.floor(10000000 + Math.random() * 90000000);\r

      \r

      pm.variables.set(\"phone\", phone);\r

      pm.variables.set(\"whatsapp\", phone);"
    language: text/javascript
order: 5000
