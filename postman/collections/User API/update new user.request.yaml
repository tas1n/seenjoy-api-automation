$kind: http-request
url: "{{seenjoy_url}}/v1/users/cmwbrjbkw001e01lp98iwm09j"
method: PATCH
body:
  type: json
  content: "{\r\n    \"username\": \"doe\"\r\n}"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is less than 5000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Content-Type is application/json; charset=utf-8", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json; charset=utf-8");
      });

    language: text/javascript
order: 6000
