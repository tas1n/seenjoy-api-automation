url: "{{seenjoy_url}}/v1/mentors"
method: POST
body:
  type: json
  content: "{\r

    \  \"nameEn\": \"Jane Doe\",\r

    \  \"nameBn\": \"জেন ডো\",\r

    \  \"slug\": \"jane-doe\",\r

    \  \"titleEn\": \"Senior Marketing Consultant\",\r

    \  \"titleBn\": \"সিনিয়র মার্কেটিং কনসালট্যান্ট\",\r

    \  \"bioEn\": \"\",\r

    \  \"bioBn\": \"\",\r

    \  \"stats\": [\r

    \    {\r

    \      \"valueEn\": \"12k+\",\r

    \      \"valueBn\": \"১২k+\",\r

    \      \"labelEn\": \"Students\",\r

    \      \"labelBn\": \"শিক্ষার্থী\"\r

    \    }\r

    \  ]\r

