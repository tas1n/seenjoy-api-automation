$kind: http-request
url: "{{seenjoy_url}}/v1/auth/refresh"
method: POST
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refresh_token}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Refresh Token Response", function () {
          pm.expect(pm.response.json().accessToken).to.not.be.null;
          pm.expect(pm.response.json().refreshToken).to.not.be.null;
      });

      pm.test("Refresh Token Status Code", function () {
          pm.response.to.have.status(200);
      });

      pm.test("accessToken is a string", ()=>{
          pm.expect(pm.response.json().accessToken).to.be.a('string');
      });

      pm.test("refreshToken is a string", () => {
          pm.expect(pm.response.json().refreshToken).to.be.a('string');
      });

      pm.test("response time", ()=>{
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type header is present", ()=>{
          pm.response.to.have.header('Content-Type');
      });

      pm.test("Content-Type header has application/json; charset=utf-8 ", ()=>{
          pm.expect(pm.response.headers.get("Content-Type")).to.eql('application/json; charset=utf-8');
      });
    language: text/javascript
order: 1000
