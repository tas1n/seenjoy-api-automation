$kind: http-request
url: "{{seenjoy_url}}/v1/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"wronguser\",\r

    \    \"password\": \"wrongpassword\"\r

    }"
scripts:
  - type: afterResponse
    code: "const jsonData = pm.response.json();\r

      \r

      pm.test(\"Status code is 401\", () => {\r

      \    pm.expect(pm.response.code).to.eql(401);\r

      });\r

      \r

      pm.test(\"Response contains the correct message\", () => {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.message).to.eql(\"Invalid credentials\");\r

      });\r

      \r

      pm.test(\"response time\", () =>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000); \r

      })\r

      \r

      pm.test(\"Content-Type header is present\", ()=>{\r

      \    pm.response.to.have.header('Content-Type');\r

      })\r

      \r

      pm.test(\"Content-Type header has application/json; charset=utf-8 \", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.eql('application/json; charset=utf-8')\r

      })\r

      \r

      const schema = {\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"statusCode\": {\r

      \      \"type\": \"integer\"\r

      \    },\r

      \    \"timestamp\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"path\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"message\": {\r

      \      \"type\": \"string\"\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"statusCode\",\r

      \    \"timestamp\",\r

      \    \"path\",\r

      \    \"message\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", () => {\r

      \    pm.expect(tv4.validate(jsonData, schema)).to.be.true;\r

      });"
    language: text/javascript
order: 2000
