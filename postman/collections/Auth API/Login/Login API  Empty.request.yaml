$kind: http-request
url: "{{seenjoy_url}}/v1/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"\",\r

    \    \"password\": \"\"\r

    }"
scripts:
  - type: afterResponse
    code: "const jsonData = pm.response.json();\r

      \r

      pm.test(\"Status code is 400\", ()=>{\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response contains expected message\", () => {\r

      \    pm.expect(pm.response.json().message).to.include(\"password must be longer than or equal to 8 characters\");\r

      });\r

      \r

      pm.test(\"Content-Type header is present\", ()=>{\r

      \    pm.response.to.have.header('Content-Type');\r

      })\r

      \r

      pm.test(\"Content-Type header has application/json; charset=utf-8 \", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.eql('application/json; charset=utf-8')\r

      })\r

      \r

      const schema ={\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"statusCode\": {\r

      \      \"type\": \"integer\"\r

      \    },\r

      \    \"timestamp\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"path\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"message\": {\r

      \      \"type\": \"array\",\r

      \      \"items\": [\r

      \        {\r

      \          \"type\": \"string\"\r

      \        }\r

      \      ]\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"statusCode\",\r

      \    \"timestamp\",\r

      \    \"path\",\r

      \    \"message\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", () => {\r

      \    pm.expect(tv4.validate(jsonData, schema)).to.be.true;\r

      });"
    language: text/javascript
order: 3000
