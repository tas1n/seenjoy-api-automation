$kind: http-request
url: "{{seenjoy_url}}/v1/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"\",\r

    \    \"password\": \"\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", ()=>{\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test(\"Response contains expected message\", () => {\r

      \    pm.expect(pm.response.json().message).to.include(\"password must be
      longer than or equal to 8 characters\");\r

      });\r

      \r

      pm.test(\"Content-Type header is present\", ()=>{\r

      \    pm.response.to.have.header('Content-Type');\r

      })\r

      \r

      pm.test(\"Content-Type header has application/json; charset=utf-8 \",
      ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.eql('applica\
      tion/json; charset=utf-8')\r

      })"
    language: text/javascript
order: 3000
