$kind: http-request
url: "{{seenjoy_url}}/v1/auth/reset-token/invalid123"
method: GET
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });

      pm.test("Response body contains valid: false", () => {
          pm.expect(pm.response.json().valid).to.be.false;
      });

      pm.test("response time", ()=>{
          pm.expect(pm.response.responseTime).to.be.below(2000); 
      })

      pm.test("Content-Type is present", ()=> {
          pm.response.to.have.header('Content-Type');
      })

      pm.test("Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json; charset=utf-8');
          })
    language: text/javascript
order: 1000
