scripts:
  - type: afterResponse
    code: "pm.environment.set(\"orderId\", pm.response.json().orderId);\r

      \r

      const schema=\r

      {\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"orderId\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"orderNumber\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"redirectUrl\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"amount\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"currency\": {\r

      \      \"type\": \"string\"\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"orderId\",\r

      \    \"orderNumber\",\r

      \    \"redirectUrl\",\r

      \    \"amount\",\r

      \    \"currency\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", ()=>{\r

      \    pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true;\r

      })\r

      \r

      pm.test(\"Status code is 201\", () => {\r

      \    pm.response.to.have.status(201);   \r

      \    })\r

      \r

      pm.test(\"Response time is less than 5000\", ()=>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000); \r

      })"
    language: text/javascript
