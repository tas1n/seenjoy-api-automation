scripts:
  - type: afterResponse
    code: "pm.test(\"Check if orderId is present\", function () {\r

      \    pm.expect(pm.response.json().orderId).to.not.be.null;\r

      });\r

      \r

      pm.test(\"Check if paymentUrl is present\", function () {\r

      \    pm.expect(pm.response.json().paymentUrl).to.not.be.null;\r

      });\r

      \r

      pm.test(\"Status code is 201\", ()=>{\r

      \    pm.response.to.have.status(201);\r

      })\r

      \r

      pm.test(\"response time is less than 5000\",()=>{\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      })\r

      \r

      const schema={\r

      \  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\r

      \  \"type\": \"object\",\r

      \  \"properties\": {\r

      \    \"orderId\": {\r

      \      \"type\": \"string\"\r

      \    },\r

      \    \"paymentUrl\": {\r

      \      \"type\": \"string\"\r

      \    }\r

      \  },\r

      \  \"required\": [\r

      \    \"orderId\",\r

      \    \"paymentUrl\"\r

      \  ]\r

      }\r

      pm.test(\"Schema is valid\", ()=>{\r

      \    pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true\r

      })"
    language: text/javascript
order: 5000
