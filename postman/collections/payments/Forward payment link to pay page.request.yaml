$kind: http-request
url: "{{seenjoy_url}}/v1/payments/{{orderId}}}/pay"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"COntent-Type is present\",()=>{\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      \    })\r

      \r

      pm.test(\"Content-Type is text/html; charset=utf-8\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"text/html; charset=utf-8\");\r

      })\r

      \r

      pm.test(\"Status code is 200\", ()=>{\r

      \    pm.expect(pm.response.to.have.status(200))\r

      })"
    language: text/javascript
order: 6000
