$kind: http-request
url: "{{seenjoy_url}}/v1/courses/{{courseId}}/reviews"
method: GET
scripts:
  - type: afterResponse
    code: "pm.environment.set(\"mentorId\", pm.response.json().id);\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      pm.test(\"COntent-Type is application/json\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      })\r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.test(\"Total reviews is 1\", function () {\r

      \    pm.expect(pm.response.json().total).to.equal(1);\r

      \    });\r

      \r

      \    pm.test(\"Limit is correct\", ()=>{\r

      \        pm.expect(pm.response.json().limit).to.equal(20)\r

      \    })"
    language: text/javascript
order: 2000
