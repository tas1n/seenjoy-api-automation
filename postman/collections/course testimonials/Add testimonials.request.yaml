$kind: http-request
url: "{{seenjoy_url}}/v1/courses/{{courseId}}/testimonials"
method: POST
body:
  type: json
  content: "{\r

    \  \"type\": \"STORY\",\r

    \  \"studentName\": \"Rafiul Islam\",\r

    \r

    \  \"storyEn\": \"This course completely changed how I approach client work.\",\r

    \  \"storyBn\": \"এই কোর্সটি ক্লায়েন্টের কাজের প্রতি আমার দৃষ্টিভঙ্গি সম্পূর্ণ পাল্টে দিয়েছে।\",\r

    \  \"outcomeEn\": \"Landed a $2,000/mo retainer client within 6 weeks\",\r

    \  \"outcomeBn\": \"\",\r

    \  \"showOnHomepage\": false\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      pm.test(\"Content-Type is present\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      });\r

      pm.test(\"COntent-Type is application/json\", ()=>{\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      })\r

      pm.test(\"Response time is less than 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.environment.set(\"testimonialId\", pm.response.json().id);"
    language: text/javascript
order: 1000
